name: Modivka Studio Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "===== ANDROID ENVIRONMENT ====="

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK root was not found."
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/*/bin/sdkmanager"
            do
              for file in $candidate; do
                if [ -x "$file" ]; then
                  SDKMANAGER="$file"
                  break 2
                fi
              done
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found on the GitHub runner."
            echo "Android SDK:"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "MODIVKA_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          echo "===== ANDROID SDK PACKAGES ====="

          SDKMANAGER="$MODIVKA_SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android SDK 36 is ready."

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare compileSdk 36
        shell: bash
        run: |
          set -e

          echo "===== COMPILE SDK ====="

          FILE="android/app/build.gradle.kts"

          test -f "$FILE"

          cp "$FILE" "$FILE.workflow-backup"

          if grep -q 'compileSdk = flutter.compileSdkVersion' "$FILE"; then
            sed -i \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
              "$FILE"
          elif grep -q 'compileSdk = [0-9]' "$FILE"; then
            sed -i -E \
              's/compileSdk = [0-9]+/compileSdk = 36/' \
              "$FILE"
          else
            echo "ERROR: compileSdk declaration not found."
            exit 1
          fi

          grep -n "compileSdk" "$FILE"

          echo "Temporary compileSdk=36 applied only inside runner."

      - name: Flutter analyze
        run: flutter analyze

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Git diff check
        run: git diff --check

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "===== SIGNING SETUP ====="

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p android/app/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/keystore/modivka-release.jks

          test -s android/app/keystore/modivka-release.jks

          cat > android/key.properties <<EOF2
storePassword=$KEYSTORE_PASSWORD
keyPassword=$KEY_PASSWORD
keyAlias=$KEY_ALIAS
storeFile=keystore/modivka-release.jks
EOF2

          test -f android/key.properties

          echo "Release signing prepared."

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "===== BUILD RELEASE APK ====="

          flutter clean
          flutter pub get

          flutter build apk --release --verbose

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK BUILD SUCCESSFUL."

      - name: Prepare release package
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Modivka-Studio-release.apk

          cd release

          zip \
            ../Modivka-Studio-${{ github.run_number }}.zip \
            Modivka-Studio-release.apk

          test -f "../Modivka-Studio-${{ github.run_number }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modivka Studio v1.0.${{ github.run_number }}
          files: Modivka-Studio-${{ github.run_number }}.zip
          generate_release_notes: true

      - name: Cleanup signing and temporary files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f android/app/keystore/modivka-release.jks
          rm -f android/app/build.gradle.kts.workflow-backup
