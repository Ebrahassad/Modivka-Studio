name: Modivka Studio Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -e

          echo "===== ANDROID SDK ====="

          SDKMANAGER=""

          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK 36: OK"

      - name: Force project compileSdk 36
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          echo "===== BEFORE ====="
          grep -n "compileSdk" "$FILE" || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              s
          )

          s = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              s
          )

          if "compileSdk = 36" not in s:
              raise SystemExit("ERROR: Could not set compileSdk = 36")

          p.write_text(s)
          PY

          echo "===== AFTER ====="
          grep -n "compileSdk" "$FILE"

          grep -q "compileSdk = 36" "$FILE"

          echo "compileSdk 36: VERIFIED"

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Git diff check
        run: git diff --check

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p android/app/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/keystore/modivka-release.jks

          cat > android/key.properties <<EOF2
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/modivka-release.jks
          EOF2

          test -f android/app/keystore/modivka-release.jks
          test -f android/key.properties

          echo "Release signing prepared."

      - name: Verify final Android configuration
        shell: bash
        run: |
          set -e

          echo "===== FINAL CONFIGURATION ====="

          grep -n "compileSdk" android/app/build.gradle.kts

          grep -q "compileSdk = 36" android/app/build.gradle.kts

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "===== CONFIGURATION VERIFIED ====="

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "===== BUILD RELEASE APK ====="
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "APK CREATED:"
          ls -lh "$APK"

      - name: Prepare release package
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp build/app/outputs/flutter-apk/app-release.apk \
            release/Modivka-Studio-release.apk

          cd release

          zip ../Modivka-Studio-${{ github.run_number }}.zip \
            Modivka-Studio-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modivka Studio v1.0.${{ github.run_number }}
          files: Modivka-Studio-${{ github.run_number }}.zip
          generate_release_notes: true

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/keystore/modivka-release.jks
