name: Modivka Studio Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "Android SDK: $SDK"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)"

          test -n "$SDKMANAGER"

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36"

      - name: Configure project compileSdk
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          test -f "$FILE"

          echo "===== BEFORE ====="
          grep -n "compileSdk" "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          old = "compileSdk = flutter.compileSdkVersion"
          new = "compileSdk = 36"

          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          echo "===== AFTER ====="
          grep -n "compileSdk" "$FILE"

          grep -q "compileSdk = 36" "$FILE"

          echo "compileSdk 36 confirmed."

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Dart Format Check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Git Diff Check
        run: git diff --check

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "===== APK ====="
          ls -lh "$APK"

      - name: Prepare Release
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Modivka-Studio-release.apk

      - name: Create ZIP
        run: |
          cd release

          zip \
            ../Modivka-Studio-${{ github.run_number }}.zip \
            Modivka-Studio-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modivka-Studio-${{ github.run_number }}
          path: release/Modivka-Studio-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modivka Studio v1.0.${{ github.run_number }}
          files: Modivka-Studio-${{ github.run_number }}.zip
          generate_release_notes: true
