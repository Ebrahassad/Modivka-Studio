name: Modivka Studio Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect Flutter Android SDK
        run: |
          set -e

          echo "Flutter:"
          flutter --version

          echo
          echo "Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Android SDK required by Flutter
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Flutter dependencies
        run: |
          set -e
          flutter pub get

      - name: Show Flutter project configuration
        run: |
          set -e

          echo "===== PUBSPEC ====="
          sed -n '1,220p' pubspec.yaml

          echo
          echo "===== ANDROID PROJECT ====="
          find android -maxdepth 3 -type f | sort

      - name: Analyze
        run: |
          set -e
          flutter analyze

      - name: Format check
        run: |
          set -e
          dart format --output=none --set-exit-if-changed lib

      - name: Git diff check
        run: |
          set -e
          git diff --check

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p android/app/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/keystore/modivka-release.jks

          cat > android/key.properties <<EOF2
          storeFile=keystore/modivka-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2

          echo "Signing files prepared temporarily."

      - name: Build release APK
        run: |
          set -e

          flutter build apk --release

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK BUILD: OK"

      - name: Prepare release
        run: |
          set -e

          mkdir -p release

          cp build/app/outputs/flutter-apk/app-release.apk \
            release/Modivka-Studio-release.apk

          cd release

          zip ../Modivka-Studio-${{ github.run_number }}.zip \
            Modivka-Studio-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modivka Studio v1.0.${{ github.run_number }}
          files: Modivka-Studio-${{ github.run_number }}.zip
          generate_release_notes: true

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/keystore/modivka-release.jks
