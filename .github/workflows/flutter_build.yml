name: Modivka Studio Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --list_installed | grep -E \
            "platforms;android-36|build-tools;36.0.0|platform-tools"

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Flutter analyze
        run: flutter analyze

      - name: Git diff check
        run: git diff --check

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p android/app/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/keystore/modivka-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/modivka-release.jks
          EOF

          test -f android/app/keystore/modivka-release.jks
          test -f android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare release package
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            release/Modivka-Studio-release.apk

      - name: Create ZIP
        run: |
          cd release
          zip ../Modivka-Studio-${{ github.run_number }}.zip \
            Modivka-Studio-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modivka Studio v1.0.${{ github.run_number }}
          files: Modivka-Studio-${{ github.run_number }}.zip
          generate_release_notes: true

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/keystore/modivka-release.jks
