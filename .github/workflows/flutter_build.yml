name: Modivka Studio Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Verify Android 36
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"

          echo "Android 36 platform: OK"

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure compileSdk 36
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          original = text

          patterns = [
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              r'compileSdk\s*=\s*\d+',
          ]

          changed = False

          for pattern in patterns:
              new_text, count = re.subn(
                  pattern,
                  'compileSdk = 36',
                  text,
                  count=1
              )

              if count:
                  text = new_text
                  changed = True
                  break

          if not changed:
              raise SystemExit(
                  "ERROR: compileSdk declaration was not found."
              )

          path.write_text(text)

          print("compileSdk configuration changed.")
          print("----- FINAL ANDROID CONFIG -----")

          for line in text.splitlines():
              if "compileSdk" in line or "targetSdk" in line or "minSdk" in line:
                  print(line)
          PY

          echo
          echo "===== VERIFY FILE ====="

          grep -n -E \
            "compileSdk|targetSdk|minSdk" \
            android/app/build.gradle.kts

          echo
          echo "===== REQUIRED CHECK ====="

          grep -Eq \
            'compileSdk[[:space:]]*=[[:space:]]*36' \
            android/app/build.gradle.kts

          echo "compileSdk = 36 CONFIRMED"

      - name: Flutter analyze
        run: flutter analyze

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Git diff check
        run: git diff --check

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p android/app/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/keystore/modivka-release.jks

          test -s android/app/keystore/modivka-release.jks

          cat > android/key.properties <<EOF2
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/modivka-release.jks
          EOF2

          test -s android/key.properties

          echo "Release signing prepared."

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " FINAL BUILD CONFIGURATION"
          echo "========================================"

          grep -n -E \
            "compileSdk|targetSdk|minSdk" \
            android/app/build.gradle.kts

          echo
          echo "========================================"
          echo " BUILD RELEASE APK"
          echo "========================================"

          flutter build apk --release

          test -s build/app/outputs/flutter-apk/app-release.apk

          echo
          echo "APK BUILD SUCCESSFUL"

      - name: Prepare release package
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp build/app/outputs/flutter-apk/app-release.apk \
            release/Modivka-Studio-release.apk

          cd release

          zip ../Modivka-Studio-${{ github.run_number }}.zip \
            Modivka-Studio-release.apk

          cd ..

          test -s \
            "Modivka-Studio-${{ github.run_number }}.zip"

          echo "Release package created."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modivka Studio v1.0.${{ github.run_number }}
          files: Modivka-Studio-${{ github.run_number }}.zip
          generate_release_notes: true

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f android/app/keystore/modivka-release.jks
