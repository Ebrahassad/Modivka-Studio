name: Modivka Studio Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Verify Android environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== FLUTTER ====="
          flutter --version

          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed | grep -E \
            "platforms;android-36|build-tools|platform-tools" || true

      - name: Prepare Android project
        run: |
          mkdir -p android/app
          mkdir -p android/keystore

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/keystore/modivka-release.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF2
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/modivka-release.jks
          EOF2

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Git diff check
        run: git diff --check

      - name: Verify compileSdk
        run: |
          grep -n -E "compileSdk|targetSdk|minSdk" \
            android/app/build.gradle.kts || true

      - name: Build release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare release
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            release/Modivka-Studio-release.apk

      - name: Create ZIP
        run: |
          cd release
          zip ../Modivka-Studio-${{ github.run_number }}.zip \
            Modivka-Studio-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modivka-Studio-${{ github.run_number }}
          path: release/Modivka-Studio-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modivka Studio v1.0.${{ github.run_number }}
          files: Modivka-Studio-${{ github.run_number }}.zip
          generate_release_notes: true

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/keystore/modivka-release.jks
