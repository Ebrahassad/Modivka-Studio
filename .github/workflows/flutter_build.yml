name: Flutter Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get --no-example

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/key

          echo "$KEYSTORE_BASE64" | base64 --decode > android/key/watermark-pro-release.jks

          cat > android/key.properties <<EOT
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=key/watermark-pro-release.jks
          EOT

          chmod 600 android/key/watermark-pro-release.jks
          chmod 600 android/key.properties

      - name: Verify Release Signing
        run: |
          set -e
          test -s android/key/watermark-pro-release.jks
          test -s android/key.properties
          grep -E '^keyAlias=|^storeFile=' android/key.properties

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build Release AAB
        run: flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Remove Signing Files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/key/watermark-pro-release.jks

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: watermark-pro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: watermark-pro-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
