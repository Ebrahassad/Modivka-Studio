name: modivka_studio
description: Modivka Studio - a complete modular image, text and video creation and conversion workspace.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  archive: ^4.3.0
  ffmpeg_kit_flutter_new_video: ^2.5.2
  file_picker: ^13.1.0
  image: ^4.10.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/modivka_icon.png
