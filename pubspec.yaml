name: watermark_pro
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  shared_preferences: ^2.5.5
  file_picker: ^8.0.0
  path_provider: ^2.1.6
  image: ^4.9.2
  share_plus: ^10.1.0
  open_folder: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1F0C2E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
